
publish_release:
  name: Publish release
  triggers:
    branches:
      only:
        - publish-release
  dependencies:
    - .yamato/CI.yml#pack
    {% for editor in editors %}
    - .yamato/CI.yml#run_vetting_test_project_{{ editor.version }}
    {% endfor %}
  agent:
    type: Unity::VM
    image: package-ci/win10:stable
    flavor: b1.large
  variables:
    UPMCI_ENABLE_PACKAGE_SIGNING: 1
  commands:
    - npm install upm-ci-utils@latest -g --registry https://artifactory.prd.cds.internal.unity3d.com/artifactory/api/npm/upm-npm
    - upm-ci package publish --package-path Packages/com.unity.ide.rider
    - git push origin HEAD:refs/heads/master-3.0 -f # should we create a PR and merge ourselves?

validate_release:
  name: Validate package for release
  triggers:
    branches:
      only:
        - next/master-3.0
  agent:
    type: Unity::VM
    image: package-ci/ubuntu-22.04:v4
    flavor: b1.large
  commands:
    - dotnet run ../ReleaseTools/PrepareRelease.csproj %VERSION%
    - git push origin HEAD:refs/heads/publish-release -f
  variables:
    VERSION: ""
editors:
  - version: 2019.4
  - version: 2020.3
  - version: 2021.3
  - version: 2022.3
  - version: 2023.2
  - version: trunk
platforms:
  - name: win
    type: Unity::VM
    image: package-ci/win10:stable
    flavor: b1.large
    envsetup: echo
  - name: mac
    type: Unity::VM::osx
    image: package-ci/macos-13:v4
    flavor: m1.mac
    envsetup: echo
  - name: linux
    type: Unity::VM
    image: package-ci/ubuntu-22.04:v4
    flavor: b1.large
    envsetup: npm config set prefix '~/npm-global'

---
manual_release:
  name: Manual internal release
  dependencies:
    - .yamato/CI.yml#pack
    {% for editor in editors %}
    - .yamato/CI.yml#run_vetting_test_project_{{ editor.version }}
    {% endfor %}
  agent:
    type: Unity::VM
    image: package-ci/ubuntu-22.04:v4
    flavor: b1.large
  commands:
    - dotnet run --project ReleaseTools/ReleaseTools.csproj $VERSION
    - npm install upm-ci-utils@latest -g --registry https://artifactory.prd.cds.internal.unity3d.com/artifactory/api/npm/upm-npm
    - upm-ci package publish --package-path Packages/com.unity.ide.rider
    - git push origin HEAD:refs/heads/master-3.0 -f 
  variables:
    VERSION: "*"
    UPMCI_ENABLE_PACKAGE_SIGNING: 1